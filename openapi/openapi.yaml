openapi: 3.0.3
info:
  title: Dummy User Service
  version: 1.0.0
  description: API contract for a small demo user microservice.
servers:
  - url: https://dummy-user-service.example.com
paths:
  /health:
    get:
      summary: Health check
      operationId: getHealth
      tags:
        - system
      responses:
        "200":
          description: Service is healthy
  /users/{user_id}:
    get:
      summary: Fetch a user by ID
      operationId: getUserById
      tags:
        - users
      parameters:
        - in: path
          name: user_id
          required: true
          schema:
            type: integer
          description: Unique numeric identifier for the user
      responses:
        "200":
          description: User found
        "404":
          description: User not found
  /users:
    post:
      summary: Create a user
      operationId: createUser
      tags:
        - users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "200":
          description: User created
components:
  schemas:
    CreateUserRequest:
      type: object
      required:
        - name
        - email
      properties:
        name:
          type: string
        email:
          type: string
          format: email
    UserResponse:
      type: object
      required:
        - id
        - name
        - email
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
          format: email